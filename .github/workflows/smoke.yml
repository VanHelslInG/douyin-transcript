name: smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    # 冒烟测试只用标准库，不装 torch / funasr，秒级跑完
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装（不含 ASR 依赖）
        run: python -m pip install -e . --no-deps
      - name: CLI 可用性
        run: |
          python -m dyasr --version
          python -m dyasr --help
      - name: 冒烟测试
        run: python tests/smoke.py
        env:
          PYTHONIOENCODING: utf-8
